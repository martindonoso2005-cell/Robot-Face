<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Robot Face - Proyecto</title>
    <!-- Importar fuente pixelada de Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    
    <style>
        /* Estilos generales y fondo nocturno estrellado */
        body {
            margin: 0;
            padding: 0;
            background-color: #0b1021;
            background-image: 
                radial-gradient(white, rgba(255,255,255,.2) 2px, transparent 4px),
                radial-gradient(white, rgba(255,255,255,.15) 1px, transparent 30px),
                radial-gradient(white, rgba(255,255,255,.1) 2px, transparent 40px);
            background-size: 550px 550px, 350px 250px, 250px 250px; 
            font-family: 'Press Start 2P', cursive;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            text-align: center;
        }

        /* Título principal amarillo pixelado */
        h1 {
            color: #FFC000;
            text-shadow: 4px 4px 0px #000000;
            margin-top: 40px;
            font-size: 24px;
            line-height: 1.5;
        }

        /* Contenedor principal estilo ventana de juego retro */
        .game-panel {
            background-color: #12151c;
            border: 8px solid #000000;
            padding: 30px;
            margin: 20px;
            max-width: 600px;
            box-shadow: 10px 10px 0px rgba(0, 0, 0, 0.5);
        }

        /* Subtítulo cyan */
        h2 {
            color: #00FFFF;
            font-size: 16px;
            margin-bottom: 25px;
            text-shadow: 2px 2px 0px #000000;
        }

        /* Contenedor del video para mantener proporciones del Short (9:16) */
        .video-container {
            border: 4px solid #000000;
            background-color: #000;
            margin: 0 auto 30px auto;
            width: fit-content;
        }

        /* Botones estilo arcade */
        .btn-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .btn {
            background-color: #FF9900; /* Naranja retro */
            color: #000000;
            border: 4px solid #000000;
            padding: 15px 20px;
            font-family: 'Press Start 2P', cursive;
            font-size: 12px;
            text-decoration: none;
            text-transform: uppercase;
            cursor: pointer;
            box-shadow: 4px 4px 0px #000000;
            transition: transform 0.1s, box-shadow 0.1s;
        }

        .btn-green {
            background-color: #32CD32; /* Verde retro */
        }

        .btn:hover {
            transform: translate(2px, 2px);
            box-shadow: 2px 2px 0px #000000;
        }

        .btn:active {
            transform: translate(4px, 4px);
            box-shadow: 0px 0px 0px #000000;
        }

        p {
            font-size: 10px;
            line-height: 1.8;
            color: #aaaaaa;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

    <h1>🔊 PROYECTO: ROBOT FACE</h1>

    <div class="game-panel">
        <h2>FUNCIONAMIENTO DEL PROYECTO</h2>
        
        <!-- Video embebido de YouTube Shorts -->
        <div class="video-container">
            <iframe width="315" height="560" 
                src="https://www.youtube.com/embed/ofJxqUiQPsg" 
                title="YouTube video player" 
                frameborder="0" 
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
                allowfullscreen>
            </iframe>
        </div>

        <p>HAZ CLIC EN EL BOTÓN PARA VER EL TRABAJO EN EL PORTAFOLIO ORIGINAL:</p>

        <div class="btn-container">
            <!-- Enlace al portafolio externo -->
            <a href="https://portafolio.insta3d.cl/universidad/robotface.html" target="_blank" class="btn btn-green">
                ▶ VER PORTAFOLIO
            </a>
            <!-- Botón opcional para volver al repo -->
            <a href="https://github.com/martindonoso2005-cell" class="btn">
                ◀ VER GITHUB
            </a>
        </div>
    </div>

</body>
</html>
